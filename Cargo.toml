[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component", "assets", "syntect"] }
alacritty_terminal = "0.26"
git2 = { version = "0.21", default-features = false }
ignore = "0.4"
nucleo = "0.5"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "9"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
log = "0.4"
env_logger = "0.11"

layout = { path = "crates/layout" }
config = { path = "crates/config" }
terminal = { path = "crates/terminal" }
git_client = { path = "crates/git_client" }
fs_tools = { path = "crates/fs_tools" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
