[package]
name = "gridterm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gridterm"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
futures.workspace = true
parking_lot.workspace = true
config.workspace = true
layout.workspace = true
terminal.workspace = true
agents = { path = "../agents" }
git_client.workspace = true
fs_tools.workspace = true
gpui-pre = { version = "=0.3.14", features = ["test-support"], optional = true }
gpui-pre-macos = { version = "=0.3.14", features = ["test-support"], optional = true }
tempfile = { workspace = true, optional = true }
serde_json = "1"
regex = "1"
# Same version as gpui-kit's editor (its LSP hooks take these types).
lsp-types = "0.97"
libc.workspace = true
toml.workspace = true
serde.workspace = true
# Same versions/features as gpui-component's `syntect` feature (shared build).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# End-to-end acceptance runner inside the real app (see scripts/e2e.sh).
e2e = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image", "dep:tempfile"]

[lints]
workspace = true
